services:
   postgres-test:
      image: postgres:16-alpine
      container_name: challenge-db-test
      ports:
         - '5433:5432'
      environment:
         POSTGRES_USER: test_user
         POSTGRES_PASSWORD: test_password
         POSTGRES_DB: challenge_db_test
      tmpfs:
         - /var/lib/postgresql/data
      healthcheck:
         test: ['CMD', 'pg_isready', '-U', 'test_user']
         interval: 1s
         timeout: 5s
         retries: 30
